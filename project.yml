name: FinanceTrack
options:
  bundleIdPrefix: com.scott
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# "Debug Preview" — a third build configuration, sibling to the standard Debug/Release pair, that
# exists SOLELY to let a Debug build compile against the phase2-sharing-test Preview Supabase
# project instead of Production. It is of type `debug` (so it still gets DEBUG-conditional code,
# symbols, etc.) and is additionally distinguished by the SPENDSMART_PREVIEW_BACKEND compile
# condition set below, under `targets.FinanceTrack.settings.configs`. Release is untouched and can
# never see this configuration or condition — see SupabaseConfig.swift's own `#if DEBUG &&
# SPENDSMART_PREVIEW_BACKEND` guard for the matching source-level protection.
configs:
  Debug: debug
  Debug Preview: debug
  Release: release

packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"

targets:
  FinanceTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceTrack
    resources:
      - path: FinanceTrack/Resources/Assets.xcassets
    info:
      path: FinanceTrack/Info.plist
      properties:
        CFBundleDisplayName: SpendSmart
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "SpendSmart uses Face ID to protect access to your financial data."
        # Password-reset / email-confirmation deep link callback — see
        # AuthenticationService.resetPassword's redirectTo and SupabaseConfig. A custom scheme for
        # now (no web domain to host an apple-app-site-association file yet); swappable to a real
        # Associated Domain/Universal Link later without an auth-flow redesign.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - spendsmart
            CFBundleURLName: com.scott.financetrack.auth-callback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scott.financetrack
        PRODUCT_NAME: FinanceTrack
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2UZJX3TEG4
      configs:
        # Only this one configuration ever sets SPENDSMART_PREVIEW_BACKEND — Release's settings
        # are untouched, so Release can never resolve to Preview regardless of scheme. `$(inherited)`
        # plus an explicit `DEBUG` keeps the DEBUG condition alongside it (a target-level override
        # would otherwise replace, not add to, the DEBUG value xcodegen's `debug` config type sets
        # at the project level) — see SupabaseConfig.swift's `#if DEBUG && SPENDSMART_PREVIEW_BACKEND`.
        "Debug Preview":
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SPENDSMART_PREVIEW_BACKEND"
    dependencies:
      - package: LinkKit
      - package: Supabase
        product: Supabase
    capabilities: []
    # Plaid OAuth (Phase P1B): the app must be reachable via this exact Universal Link so iOS
    # routes a bank's OAuth/App-to-App return back into SpendSmart. LinkKit completes the OAuth
    # round-trip internally once foregrounded this way — see PlaidConnectionManager.swift's
    # PlaidOAuthReturn for the app-side recognition boundary. xcodegen writes the actual
    # .entitlements file at the path below; do not hand-edit it, it is regenerated on every
    # `xcodegen generate`.
    #
    # ICLOUD BACKUP — CloudBackupManager writes/prunes dated JSON snapshots into this app's own
    # iCloud Documents ubiquity container (never CloudKit records — plain files, matching
    # SpendSmartBackupService's existing local-backup shape exactly). Requires a paid Apple
    # Developer Program membership to register the `iCloud.com.scott.financetrack` container; on
    # first build from Xcode itself (not a bare `xcodebuild` CLI run) with a signed-in Apple ID,
    # Xcode may need to auto-register this container against the team — if a CLI build ever fails
    # here on code signing/provisioning, open the project in Xcode once and let Signing &
    # Capabilities resolve it, then CLI builds work again.
    entitlements:
      path: FinanceTrack/FinanceTrack.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:plaid.sldevapps.com
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.scott.financetrack
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.scott.financetrack

  FinanceTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinanceTrackTests
    dependencies:
      - target: FinanceTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  FinanceTrack:
    build:
      targets:
        FinanceTrack: all
        FinanceTrackTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinanceTrackTests
    archive:
      config: Release
  # DEBUG-ONLY, Preview-backend counterpart to the scheme above — Run always uses the "Debug
  # Preview" configuration (SPENDSMART_PREVIEW_BACKEND set, see targets.FinanceTrack.settings.configs
  # above), so selecting this scheme is the only way to build against phase2-sharing-test. No test
  # action: unit tests keep running under the normal FinanceTrack scheme/Debug config, unaffected by
  # backend selection. Archive still resolves to Release — even archiving from this scheme can never
  # ship a Preview-pointed build.
  FinanceTrack Preview:
    build:
      targets:
        FinanceTrack: all
    run:
      config: "Debug Preview"
    archive:
      config: Release
